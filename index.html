<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>给你的信</title>

  <!-- 0. 字体：ZCOOL KuaiLe (中文可爱) + Nunito (英文圆润) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- 1. 基础样式库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <!-- 2. 粒子背景库 -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <!-- 3. Three.js (粒子圣诞树用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- 4. MediaPipe Hands (手势识别) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- 引入自己的样式和脚本 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 跳过导航链接（无障碍） -->
  <a href="#main-content" class="skip-link">跳到主要内容</a>

  <!-- ============================================ -->
  <!-- 场景1：星空夜信                                  -->
  <!-- ============================================ -->
  <main id="main-content">
    <section id="scene1" class="scene active" aria-label="信封场景">

      <!-- Canvas 真实星空背景 -->
      <canvas id="starfield-canvas" aria-hidden="true"></canvas>

      <!-- 前景萤火虫光点 -->
      <div class="fireflies" aria-hidden="true">
        <span class="firefly f1"></span><span class="firefly f2"></span><span class="firefly f3"></span>
        <span class="firefly f4"></span><span class="firefly f5"></span><span class="firefly f6"></span>
        <span class="firefly f7"></span><span class="firefly f8"></span>
      </div>

      <!-- 信封上方文案 + 小狗 -->
      <div class="question-row">
        <p class="envelope-question">你愿意打开这封信吗？</p>
        <img src="assets/images/dog09.png" class="dog-by-text" alt="" aria-hidden="true">
      </div>

      <div class="envelope-container">
        <div class="envelope" role="img" aria-label="一封白色的信">
          <div class="envelope-body">
            <div class="envelope-flap"></div>
            <div class="envelope-rect"></div>
          </div>
          <div class="envelope-heart" aria-hidden="true"></div>
        </div>
      </div>

      <div class="buttons">
        <button id="btn-yes" class="cute-btn btn-yes-glow">愿意</button>
        <button id="btn-no" class="cute-btn btn-no-ghost">不愿意</button>
      </div>
    </section>
  </main>

  <!-- ============================================ -->
  <!-- 场景2：星辰之树 + 手势 + 音乐                       -->
  <!-- ============================================ -->
  <section id="scene2" class="scene" aria-label="音乐场景">

    <!-- 萤火虫光点（延续场景1的视觉元素） -->
    <div class="fireflies fireflies-s2" aria-hidden="true">
      <span class="firefly f1"></span><span class="firefly f2"></span><span class="firefly f3"></span>
      <span class="firefly f4"></span><span class="firefly f5"></span>
    </div>

    <div class="tree-glow" aria-hidden="true"></div>

    <!-- 情话浮层 -->
    <div class="love-message" aria-live="polite">
      <p class="love-text">星空这么大，而我只看得到你。</p>
      <p class="love-sub">You're the only star I see.</p>
    </div>

    <!-- 播放键 -->
    <button id="play-btn" aria-label="播放音乐">
      <div class="play-btn-glow" aria-hidden="true"></div>
      <div class="play-btn-icon" aria-hidden="true"></div>
      <span class="play-btn-label">点击播放</span>
    </button>

    <!-- 音频控制栏 -->
    <div id="audio-controls" role="group" aria-label="音频控制">
      <button id="pause-btn" class="audio-ctrl-btn" aria-label="暂停">⏸</button>
      <div class="progress-wrap">
        <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      </div>
      <span id="time-display" aria-live="polite">00:00</span>
    </div>

    <!-- 兜底按钮 -->
    <button id="fallback-play-btn" class="cute-btn">点击播放</button>

    <div id="camera-container">
      <video id="input-video" autoplay playsinline style="display:none;" aria-hidden="true"></video>
      <canvas id="particle-canvas" aria-hidden="true"></canvas>
    </div>
    <div class="drift-glow" aria-hidden="true"></div>
    <div id="gesture-hint" aria-live="polite">对着摄像头挥挥手吧～</div>
  </section>

  <!-- ============================================ -->
  <!-- 场景3：黎明感谢信                                 -->
  <!-- ============================================ -->
  <section id="scene3" class="scene" aria-label="感谢信">

    <!-- 晨曦光尘 -->
    <div class="dust-layer" aria-hidden="true">
      <span class="dust d1"></span><span class="dust d2"></span><span class="dust d3"></span>
      <span class="dust d4"></span><span class="dust d5"></span><span class="dust d6"></span>
      <span class="dust d7"></span><span class="dust d8"></span><span class="dust d9"></span>
      <span class="dust d10"></span><span class="dust d11"></span><span class="dust d12"></span>
    </div>

    <!-- 感谢信卡片 -->
    <article class="thankyou-card">
      <!-- 标题 + 小狗 -->
      <div class="card-title-row">
        <h2 class="card-title">谢谢你听完这段话</h2>
        <img src="assets/images/dog09.png" class="dog-by-title" alt="" aria-hidden="true">
      </div>

      <!-- 装饰分割线 -->
      <div class="card-divider" aria-hidden="true">
        <span class="divider-heart"></span>
        <span class="divider-heart"></span>
        <span class="divider-heart"></span>
      </div>

      <!-- 正文 -->
      <div class="card-body">
        <p>嘿，当你看到这里的时候，我已经把藏在心里很久的话，借着这封信说出来了。</p>
        <p>遇见你之后，每一天都变得不一样了。你笑的时候，好像全世界的星星都亮了起来。你皱眉的时候，我也忍不住想帮你把所有烦恼都赶走。</p>
        <p>不管未来的路会怎样，我知道——我想和你一起走下去。春天的花、夏天的风、秋天的落叶、冬天的暖阳，我都想和你一起看。</p>
        <p>所以，谢谢你愿意听完这封信。</p>
        <p>认识你，已经是我最大的幸运了。</p>
      </div>

      <!-- 签名 -->
      <p class="card-signature">—— 那个偷偷喜欢你很久的人</p>

      <!-- 卡片底部两只小狗靠在一起 -->
      <div class="card-bottom-dogs">
        <img src="assets/images/dog14.png" alt="" aria-hidden="true">
        <img src="assets/images/dog16.png" alt="" aria-hidden="true">
      </div>
    </article>
  </section>

  <script src="script.js"></script>
</body>
</html>
